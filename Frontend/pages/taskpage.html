<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOZO – Create Task</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="/static/assets/logo.png"
        type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/taskpage.css">
</head>

<body>

    <div class="container">
        <h1>+ Create New Task</h1>

        <form id="taskForm">
            <div class="form-group">
                <label for="task_title">Task Title</label>
                <input type="text" id="task_title" name="task_title"
                    placeholder="e.g., Prepare Lecture Slides for Batch A" required>
            </div>

            <div class="form-group">
                <label for="task_description">Description</label>
                <textarea id="task_description" name="task_description"
                    placeholder="Provide detailed instructions for the task..."></textarea>
            </div>

            <h2>Scheduling & Deadline</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="due_date">Due Date</label>
                    <input type="date" id="due_date" name="due_date" required>
                </div>

                <div class="form-group">
                    <label for="due_time">Due Time (Optional)</label>
                    <input type="time" id="due_time" name="due_time">
                </div>
            </div>

            <h2>Assignment & Priority</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="assigned_to">Assigned To</label>
                    <select id="assigned_to" name="assigned_to" required>
                        <option value="">Select Batch</option>
                        <option value="Batch 5 ALL">Batch 5 ALL</option>
                        <option value="Section A">Section A</option>
                        <option value="Section B">Section B</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Priority Level</label>
                    <select id="priority" name="priority" required>
                        <option value="medium">Medium</option>
                        <option value="high">High (Urgent)</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>

            <div class="action-buttons">
                <a href="/admin/tasks">
                    <button type="button" class="btn btn-secondary">Cancel</button>
                </a>

                <button type="submit" class="btn btn-primary">
                    Save Task
                </button>
            </div>
        </form>
    </div>

    <!-- JS -->
    <script src="/static/js/admin_task.js"></script>

</body>

</html>
