<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students | DOZO Student Portal</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- Favicon -->
    <link rel="shortcut icon" href="/static/assets/logo.png"
        type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/admin_student_page.css">
</head>

<body>

    <div class="dashboard-layout">
        <main class="main-content">

            <!-- HEADER -->
            <header class="top-header">
                <div class="search-bar">
                    <input type="text" placeholder="Search students..." class="search-input">
                    <i class="fas fa-search search-icon"></i>
                </div>
            </header>

            <!-- PAGE HEADER -->
            <div class="page-header">
                <h2>All Students</h2>

                <!-- Back via route -->
                <a href="/admin" class="back-link">Back</a>

                <a href="/admin/students/add">
                    <button class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Add New Student
                    </button>
                </a>
            </div>

            <!-- FILTERS -->
            <div class="student-filters">
                <select class="filter-select">
                    <option>All Batches</option>
                    <option>Web Development - Batch A</option>
                    <option>JavaScript - Batch B</option>
                </select>

                <select class="filter-select">
                    <option>Filter by Status</option>
                    <option>Active</option>
                    <option>Inactive</option>
                </select>
            </div>

            <!-- STUDENT LIST -->
            <div class="student-list-card">

                <div class="list-header">
                    <span class="header-col student-info-col">Student Name</span>
                    <span class="header-col">Batch</span>
                    <span class="header-col">Attendance</span>
                    <span class="header-col">Status</span>
                    <span class="header-col actions-col">Actions</span>
                </div>

                <!-- Student items will be inserted here by JS -->

                <!-- PAGINATION -->
                <div class="pagination">
                    <span>Showing 1 to 10 of 45 students</span>
                    <div>
                        <button class="icon-btn"><i class="fas fa-chevron-left"></i></button>
                        <button class="icon-btn active">1</button>
                        <button class="icon-btn">2</button>
                        <button class="icon-btn">3</button>
                        <button class="icon-btn"><i class="fas fa-chevron-right"></i></button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/static/js/admin_students.js"></script>
</body>

</html>
